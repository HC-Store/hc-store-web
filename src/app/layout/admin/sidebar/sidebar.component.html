    <span class="logo-text">HC <span class="store">STORE</span></span>
  </div>

  <nav>

    <span class="section">Geral</span>

    <a routerLink="/admin/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span class="label">Dashboard</span>
    </a>

    <a routerLink="/admin/produtos" routerLinkActive="active">
      <svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
      <span class="label">Todos os produtos</span>
    </a>

    <a routerLink="/admin/pedidos" routerLinkActive="active">

    <a routerLink="/admin/usuarios" routerLinkActive="active">

      <span class="label">Adicionar produto</span>
    </a>

    <span class="section">Loja</span>

    <a routerLink="/admin/config-home" routerLinkActive="active">
      <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9v12h14V9"/><path d="M10 21v-6h4v6"/></svg>
      <span class="label">Config. home</span>

    <a routerLink="/admin/config-colecoes" routerLinkActive="active">
