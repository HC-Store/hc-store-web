<div class="page">
  <div class="page-head">
    <div>
      <h2>Configurar Coleções</h2>
      <p class="subtitle">Banner, contagem regressiva e textos do drop</p>
    </div>
  </div>

  <p class="alert success" *ngIf="sucesso">✓ {{ sucesso }}</p>
  <p class="alert error" *ngIf="erro">{{ erro }}</p>

  <!-- BANNER -->
  <div class="section-card">
    <h3>Banner da Página</h3>
    <label>URL da imagem</label>
    <input [(ngModel)]="config.bannerImagem" placeholder="assets/img/banner-colecoes.png" />
    <img *ngIf="config.bannerImagem" [src]="config.bannerImagem" class="preview-media preview-banner" />
  </div>

  <div class="two-cols">
    <!-- TIMER -->
    <div class="section-card">
      <h3>Countdown — Data de Lançamento</h3>
      <label>Data e hora do lançamento</label>
      <input type="datetime-local" [(ngModel)]="config.dataLancamento" />
    </div>

    <!-- TEXTOS -->
    <div class="section-card">
      <h3>Textos do Drop</h3>

      <div class="row">
        <div class="field">
          <label>Título</label>
          <input [(ngModel)]="config.dropTitulo" placeholder="DROP 01:" />
        </div>

        <div class="field">
          <label>Subtítulo</label>
          <input [(ngModel)]="config.dropSubtitulo" placeholder="OFF-GRID" />
        </div>
      </div>

      <div class="field">
        <label>Descrição</label>
        <textarea [(ngModel)]="config.dropDescricao" rows="4"
          placeholder="Descrição do drop..."></textarea>
      </div>
    </div>
  </div>

  <div class="save-bar">
    <button class="btn-primary" (click)="salvar()">SALVAR CONFIGURAÇÕES</button>
  </div>
</div>
