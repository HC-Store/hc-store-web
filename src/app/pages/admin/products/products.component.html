<div class="screen active" id="screen-produtos">
  <div class="page-head">
    <div>
      <h2>Todos os Produtos</h2>
      <p class="subtitle">{{ produtos.length }} produtos cadastrados</p>
    </div>
    <button class="btn-primary" (click)="novoProduto()">+ Novo Produto</button>
  </div>

  <p *ngIf="carregando" class="alert info">Carregando...</p>
  <p *ngIf="erro" class="alert error">{{ erro }}</p>
  <div *ngIf="!carregando && produtos.length === 0" class="panel empty-state">Nenhum produto cadastrado.</div>

  <div class="products-grid">
    <div class="product-card" *ngFor="let produto of produtos; let i = index">
      <div class="product-img">
        <img
          [src]="produto.imagens?.[0]?.url || 'assets/img/sem-imagem.png'"
          [alt]="produto.nome"
        />
        <span class="product-cat">{{ produto.categoria?.nome || '—' }}</span>
        <div class="product-actions">
          <button class="action edit" (click)="editarProduto(i)" title="Editar">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button class="action delete" (click)="removerProduto(i)" title="Excluir">
            <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
          </button>
        </div>
      </div>

      <div class="product-body">
        <div class="product-top">
          <div class="product-name">{{ produto.nome }}</div>
          <div class="product-price">R$ {{ produto.preco }}</div>
        </div>

        <div class="size-grid">
          <span *ngFor="let size of (produto.tamanho?.split(',') || [])" class="size-tag">
            {{ size }}
          </span>
        </div>

        <div class="product-desc">{{ produto.descricao }}</div>

        <div class="stat-row">
          <span class="stat-label">Estoque</span>
          <div class="stat-bar">
            <div class="stat-fill" [style.width.%]="(produto.estoque/1500)*100"></div>
          </div>
          <span class="stat-val">{{ produto.estoque }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal" *ngIf="showModal" (click)="showModal=false">
  <div class="modal-box wide" (click)="$event.stopPropagation()">
    <h3>Editar Produto</h3>

    <div class="form-grid">
      <div class="field full">
        <label>Nome</label>
        <input [(ngModel)]="form.nome" placeholder="Nome" />
      </div>
      <div class="field">
        <label>Preço</label>
        <input [(ngModel)]="form.preco" placeholder="Preço" type="number" />
      </div>
      <div class="field">
        <label>Estoque</label>
        <input [(ngModel)]="form.estoque" placeholder="Estoque" type="number" />
      </div>
      <div class="field">
        <label>Tamanhos</label>
        <input [(ngModel)]="form.tamanho" placeholder="Tamanhos (ex: P,M,G)" />
      </div>
      <div class="field">
        <label>Marca</label>
        <input [(ngModel)]="form.marca" placeholder="Marca" />
      </div>
      <div class="field full">
        <label>Descrição</label>
        <textarea [(ngModel)]="form.descricao" placeholder="Descrição"></textarea>
      </div>
      <div class="field full">
        <label>Composição do material</label>
        <textarea [(ngModel)]="form.composicaoMaterial" placeholder="Composicao do material"></textarea>
      </div>
      <div class="field full">
        <label>Instruções de lavagem</label>
        <textarea [(ngModel)]="form.instrucaoLavagem" placeholder="Instrucoes de lavagem"></textarea>
      </div>
      <div class="field full">
        <label>Envio e devoluções</label>
        <textarea [(ngModel)]="form.enviosDevolucoes" placeholder="Envio e devolucoes"></textarea>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-ghost" (click)="showModal=false">Cancelar</button>
      <button class="btn-primary" (click)="salvarProduto()">Salvar</button>
    </div>
  </div>
</div>
