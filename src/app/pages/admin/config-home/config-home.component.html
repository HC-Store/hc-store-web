<div class="page">
  <div class="page-head">
    <div>
      <h2>Configurar Home</h2>
      <p class="subtitle">Personalize o banner, categorias e vitrines da página inicial</p>
    </div>
  </div>

  <p class="alert success" *ngIf="sucesso">✓ {{ sucesso }}</p>
  <p class="alert error" *ngIf="erro">{{ erro }}</p>

  <!-- VÍDEO -->
  <div class="section-card">
    <h3>Vídeo do Banner Principal</h3>
    <label>URL do vídeo</label>
    <input [(ngModel)]="config.videoUrl" placeholder="assets/video/banner-home.mp4" />
    <video *ngIf="config.videoUrl" [src]="config.videoUrl" muted autoplay loop class="preview-media preview-video"></video>
  </div>

  <!-- BANNERS -->
  <div class="section-card">
    <h3>Banners das Categorias</h3>

    <div class="banner-grid">
      <div class="field">
        <label>Banner 1 (Tênis)</label>
        <input [(ngModel)]="config.banner1" placeholder="URL da imagem" />
        <img *ngIf="config.banner1" [src]="config.banner1" class="preview-media preview-banner" />
      </div>

      <div class="field">
        <label>Banner 2 (Acessórios)</label>
        <input [(ngModel)]="config.banner2" placeholder="URL da imagem" />
        <img *ngIf="config.banner2" [src]="config.banner2" class="preview-media preview-banner" />
      </div>

      <div class="field">
        <label>Banner 3 (Roupas)</label>
        <input [(ngModel)]="config.banner3" placeholder="URL da imagem" />
        <img *ngIf="config.banner3" [src]="config.banner3" class="preview-media preview-banner" />
      </div>
    </div>
  </div>

  <!-- DESTAQUES -->
  <div class="section-card">
    <h3>Produtos em Destaque</h3>

    <div class="item-row" *ngFor="let d of config.destaques; let i = index">
      <div class="thumb">
        <img *ngIf="d.imagem" [src]="d.imagem" />
      </div>
      <div class="item-fields">
        <input [(ngModel)]="d.id" type="number" placeholder="ID do produto" />
        <input [(ngModel)]="d.titulo" placeholder="Título" />
        <input class="span-2" [(ngModel)]="d.imagem" placeholder="URL da imagem" />
      </div>
      <button class="btn-remove" (click)="removerDestaque(i)" title="Remover">✕</button>
    </div>

    <button class="btn-add" (click)="adicionarDestaque()">+ Adicionar Destaque</button>
  </div>

  <!-- LANÇAMENTOS -->
  <div class="section-card">
    <h3>Últimos Lançamentos</h3>

    <div class="item-row" *ngFor="let l of config.lancamentos; let i = index">
      <div class="thumb">
        <img *ngIf="l.imagem" [src]="l.imagem" />
      </div>
      <div class="item-fields">
        <input [(ngModel)]="l.id" type="number" placeholder="ID do produto" />
        <input [(ngModel)]="l.titulo" placeholder="Título" />
        <input class="span-2" [(ngModel)]="l.imagem" placeholder="URL da imagem" />
      </div>
      <button class="btn-remove" (click)="removerLancamento(i)" title="Remover">✕</button>
    </div>

    <button class="btn-add" (click)="adicionarLancamento()">+ Adicionar Lançamento</button>
  </div>

  <div class="save-bar">
    <button class="btn-primary" (click)="salvar()">SALVAR CONFIGURAÇÕES</button>
  </div>
</div>
